<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14112B">
<title>66-Day Reset</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#14112B;--card:#1F1B40;--card2:#2A2554;--ink:#F4F1FF;--mut:#9A93C9;--flame:#FF8A3D;--xp:#7C5CFF;--ok:#3DDC97;--miss:#5A3552;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 Nunito,system-ui,sans-serif}
#shell{max-width:440px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 110px}
.hidden{display:none!important}
h1,h2,h3,p{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top h1{font-size:1.5rem;font-weight:900}
.pill{background:var(--card);border-radius:30px;padding:7px 14px;font-weight:800;font-size:.9rem}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px}
.mut{color:var(--mut);font-size:.85rem}
/* streak hero */
.hero{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#3A2A7A,#1F1B40);}
.flame{font-size:3.6rem;line-height:1;filter:drop-shadow(0 0 14px #ff8a3d88)}
.hero b{font-size:2.4rem;font-weight:900;display:block;line-height:1}
.week{display:flex;justify-content:space-between;margin-top:14px}
.wd{text-align:center;font-size:.72rem;color:var(--mut);font-weight:800}
.wd i{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--card2);margin-top:5px;font-style:normal;font-size:.9rem;color:var(--mut)}
.wd.full i{background:var(--ok);color:#0c2a1d}.wd.part i{background:#7a6cd0;color:#fff}.wd.miss i{background:var(--miss)}.wd.today i{outline:2px solid var(--flame);outline-offset:2px}
/* xp */
.lvl{display:flex;justify-content:space-between;font-weight:900;margin-bottom:8px}
.bar{height:12px;background:var(--card2);border-radius:12px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),#B39CFF);border-radius:12px;transition:width .5s}
/* quests */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 10px}
.sec h2{font-size:1.15rem;font-weight:900}
.quest{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:15px;margin-bottom:10px;cursor:pointer;border:2px solid transparent;transition:transform .12s}
.quest:active{transform:scale(.97)}
.quest.on{border-color:var(--ok);background:#1B3A3A}
.chk{width:34px;height:34px;border-radius:50%;border:3px solid var(--mut);display:grid;place-items:center;flex:none;font-weight:900;color:#0c2a1d}
.quest.on .chk{background:var(--ok);border-color:var(--ok);animation:pop .35s}
@keyframes pop{50%{transform:scale(1.3)}}
.quest .n{flex:1;font-weight:800}
.xpt{font-size:.8rem;font-weight:900;color:#B39CFF}
.bonus{background:linear-gradient(90deg,var(--flame),#FFC23D);color:#2b1700;border-radius:var(--r);padding:14px;font-weight:900;text-align:center;margin-bottom:10px}
/* journey */
.big{display:flex;gap:14px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.cell{aspect-ratio:1;border-radius:50%;border:0;background:var(--card2);color:var(--mut);font:800 .8rem Nunito,sans-serif;cursor:pointer}
.cell.full{background:var(--ok);color:#0c2a1d}.cell.part{background:#7a6cd0;color:#fff}.cell.miss{background:var(--miss);color:#e9b3d4}
.cell.today{outline:3px solid var(--flame);outline-offset:2px}.cell.future{opacity:.4;cursor:default}.cell.sel{box-shadow:0 0 0 3px #fff}
.cell.ms{border-radius:14px}
.phase{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.phase .dot{font-size:1.6rem}
/* badges */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card2);border-radius:16px;padding:12px 6px;text-align:center;font-size:.72rem;font-weight:800;opacity:.4}
.badge.on{opacity:1;background:#3A2A7A}
.badge span{display:block;font-size:1.8rem}
/* buttons / inputs */
.btn{width:100%;border:0;border-radius:16px;padding:15px;font:900 1rem Nunito,sans-serif;background:var(--xp);color:#fff;cursor:pointer;margin-top:10px}
.btn.alt{background:var(--card2)}.btn.red{background:#5A2A45}
input,textarea{width:100%;background:var(--card2);border:2px solid transparent;border-radius:14px;padding:13px;color:var(--ink);font:700 1rem Nunito,sans-serif;margin-top:6px}
input:focus,textarea:focus{outline:0;border-color:var(--xp)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row input{margin:0}
.x{background:none;border:0;color:var(--mut);font-size:1.6rem;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{background:var(--card2);border:0;color:var(--ink);padding:8px 12px;border-radius:20px;font:800 .8rem Nunito,sans-serif;cursor:pointer}
/* tabs */
nav{position:fixed;left:0;right:0;bottom:0;background:#1A1636ee;backdrop-filter:blur(12px);display:flex;justify-content:center;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 8px)}
nav div{display:flex;max-width:440px;width:100%}
nav button{flex:1;background:none;border:0;color:var(--mut);font:800 .72rem Nunito,sans-serif;padding:6px;cursor:pointer}
nav button span{display:block;font-size:1.5rem}
nav button.on{color:#fff}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="shell">

<!-- ONBOARDING / EDIT -->
<section id="setup" class="hidden">
  <div class="top"><h1 id="setupTitle">Reset your life</h1></div>
  <div class="card">
    <p class="mut">Pick your daily quests. Complete them for 66 days and the habits become automatic.</p>
  </div>
  <div class="card">
    <label class="mut">Why are you doing this?
      <textarea id="why" rows="2" placeholder="I want to feel strong and calm every day."></textarea></label>
    <br><label class="mut">Start date <input type="date" id="start"></label>
  </div>
  <div class="card">
    <h3>Daily quests</h3>
    <div class="chips" id="chips"></div>
    <div id="inputs"></div>
    <button class="btn alt" id="addH">+ Add quest</button>
  </div>
  <button class="btn" id="go">Start my 66 days</button>
  <button class="btn alt hidden" id="cancel">Cancel</button>
</section>

<!-- TODAY -->
<section id="v-today" class="hidden">
  <div class="top"><h1 id="hello">Today</h1><div class="pill" id="dayPill">Day 1/66</div></div>
  <div class="card hero">
    <div class="flame">🔥</div>
    <div><b id="streak">0</b><span class="mut">day streak</span></div>
  </div>
  <div class="card"><div class="week" id="week"></div></div>
  <div class="card">
    <div class="lvl"><span id="lvlName">Level 1</span><span id="xpTxt">0 XP</span></div>
    <div class="bar"><i id="xpBar"></i></div>
  </div>
  <div class="sec"><h2 id="qTitle">Daily quests</h2><span class="mut" id="qCount"></span></div>
  <div id="quests"></div>
  <div class="bonus hidden" id="bonus">⚡ All quests done! +20 bonus XP</div>
  <p class="mut" id="whyText" style="text-align:center;margin-top:16px"></p>
</section>

<!-- JOURNEY -->
<section id="v-journey" class="hidden">
  <div class="top"><h1>Your journey</h1></div>
  <div class="card big">
    <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#2A2554" stroke-width="12"/><circle id="ringC" cx="50" cy="50" r="42" fill="none" stroke="#7C5CFF" stroke-width="12" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 50 50)"/><text id="ringT" x="50" y="57" text-anchor="middle" fill="#fff" font-family="Nunito" font-weight="900" font-size="22">0%</text></svg>
    <div><h3 id="jTitle">Day 1 of 66</h3><p class="mut" id="jSub"></p></div>
  </div>
  <div class="card" id="phases"></div>
  <div class="card"><div class="grid" id="grid"></div><p class="mut" style="margin-top:12px">Tap a past day to edit it.</p></div>
</section>

<!-- PROFILE -->
<section id="v-profile" class="hidden">
  <div class="top"><h1>Profile</h1></div>
  <div class="card">
    <div class="lvl"><span id="pLvl">Level 1</span><span id="pXp">0 XP</span></div>
    <div class="bar"><i id="pBar"></i></div>
  </div>
  <div class="sec"><h2>Badges</h2></div>
  <div class="badges" id="badges"></div>
  <div class="sec"><h2>Settings</h2></div>
  <button class="btn alt" id="edit" style="margin-top:0">Edit quests and goal</button>
  <button class="btn alt" id="exp">Export backup</button>
  <button class="btn red" id="reset">Start over</button>
</section>
</div>

<nav id="nav" class="hidden"><div>
  <button data-t="today" class="on"><span>🏠</span>Today</button>
  <button data-t="journey"><span>🗺️</span>Journey</button>
  <button data-t="profile"><span>👤</span>Profile</button>
</div></nav>

<script>
const KEY='reset66.app.v1',DAY=864e5,$=id=>document.getElementById(id);
let S=load(),sel=null,tab='today',draft=[];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem('reset66.v1'))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,8);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dstart=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const todayIdx=()=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((t-dstart(S.start))/DAY)};
const doneN=i=>(S.log[i]||[]).filter(id=>S.habits.some(h=>h.id===id)).length;
const st=i=>{const d=doneN(i),n=S.habits.length;return d===0?'none':d===n?'full':'part'};
const LV=['Beginner','Starter','Challenger','Climber','Warrior','Master','Legend'];
function xpTotal(){let x=0;const t=Math.min(todayIdx(),65);for(let i=0;i<=t;i++){x+=doneN(i)*10;if(st(i)==='full')x+=20}return x}
function level(x){const l=Math.floor(x/150);return{n:l+1,name:LV[Math.min(l,LV.length-1)],cur:x-l*150,need:150}}
function streak(){const t=Math.min(todayIdx(),65);let s=0;for(let i=t;i>=0;i--){if(st(i)==='full')s++;else if(i===t&&todayIdx()<66)continue;else break}return s}
function best(){let b=0,c=0;for(let i=0;i<=Math.min(todayIdx(),65);i++){if(st(i)==='full'){c++;b=Math.max(b,c)}else c=0}return b}

/* setup */
const SUG=['💧 Drink 2L water','🏃 Exercise 30 min','📖 Read 10 pages','🧘 Meditate','🛏️ Sleep before 11pm','📵 No phone first hour','✍️ Journal','🥗 Eat clean'];
function openSetup(){
  draft=S?S.habits.map(h=>({...h})):[{id:uid(),name:''},{id:uid(),name:''},{id:uid(),name:''}];
  $('why').value=S?S.why:'';$('start').value=S?S.start:iso(new Date());
  $('go').textContent=S?'Save changes':'Start my 66 days';
  $('setupTitle').textContent=S?'Edit quests':'Reset your life';
  $('cancel').classList.toggle('hidden',!S);
  $('chips').innerHTML='';
  SUG.forEach(s=>{const b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=()=>{const e=draft.find(h=>!h.name.trim());if(e)e.name=s;else if(draft.length<8)draft.push({id:uid(),name:s});inputs()};$('chips').appendChild(b)});
  inputs();view('setup');
}
function inputs(){
  const box=$('inputs');box.innerHTML='';
  draft.forEach((h,i)=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML='<input type="text" maxlength="50" placeholder="Quest '+(i+1)+'"><button class="x" aria-label="Remove">×</button>';
    const inp=r.querySelector('input');inp.value=h.name;inp.oninput=e=>h.name=e.target.value;
    r.querySelector('button').onclick=()=>{draft.splice(i,1);inputs()};
    box.appendChild(r);
  });
}
$('addH').onclick=()=>{if(draft.length<8){draft.push({id:uid(),name:''});inputs()}};
$('cancel').onclick=()=>render();
$('go').onclick=()=>{
  const habits=draft.filter(h=>h.name.trim()).map(h=>({id:h.id,name:h.name.trim()}));
  if(!habits.length){alert('Add at least one quest.');return}
  S={why:$('why').value.trim(),start:$('start').value||iso(new Date()),habits,log:S?S.log:{}};
  sel=null;tab='today';save();render();
};

/* views */
function view(v){
  ['setup','v-today','v-journey','v-profile'].forEach(id=>$(id).classList.toggle('hidden',id!==v));
  $('nav').classList.toggle('hidden',v==='setup');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on','v-'+b.dataset.t===v));
  scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});

function render(){
  if(!S){openSetup();return}
  const t=todayIdx(),cur=Math.min(Math.max(t,0),65);
  if(sel===null||sel>t)sel=cur;
  const x=xpTotal(),L=level(x),pct=L.cur/L.need*100;
  ['lvlName','pLvl'].forEach(id=>$(id).textContent='Level '+L.n+' · '+L.name);
  ['xpTxt','pXp'].forEach(id=>$(id).textContent=x+' XP');
  $('xpBar').style.width=pct+'%';$('pBar').style.width=pct+'%';
  $('dayPill').textContent='Day '+(t<0?0:Math.min(t+1,66))+'/66';
  $('streak').textContent=streak();
  $('whyText').textContent=S.why?'“'+S.why+'”':'';

  // quests
  const d=dstart(S.start);d.setDate(d.getDate()+sel);
  $('qTitle').textContent=sel===t?'Daily quests':'Day '+(sel+1)+' · '+d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  $('qCount').textContent=doneN(sel)+'/'+S.habits.length+' done';
  const q=$('quests');q.innerHTML='';
  S.habits.forEach(h=>{
    const on=(S.log[sel]||[]).includes(h.id);
    const el=document.createElement('div');el.className='quest'+(on?' on':'');el.tabIndex=0;el.setAttribute('role','checkbox');el.setAttribute('aria-checked',on);
    el.innerHTML='<div class="chk">'+(on?'✓':'')+'</div><div class="n"></div><div class="xpt">+10 XP</div>';
    el.querySelector('.n').textContent=h.name;
    const tog=()=>{const l=S.log[sel]||[];S.log[sel]=on?l.filter(i=>i!==h.id):[...l,h.id];save();render()};
    el.onclick=tog;el.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tog()}};
    q.appendChild(el);
  });
  $('bonus').classList.toggle('hidden',st(sel)!=='full');

  // week strip (last 7 days up to today)
  const wk=$('week');wk.innerHTML='';
  for(let k=6;k>=0;k--){
    const i=t-k;if(i<0&&k>t)continue;
    const dt=dstart(S.start);dt.setDate(dt.getDate()+i);
    const s=i>=0&&i<=65?st(i):'none';
    const cls=i===t?'today ':'';
    const e=document.createElement('div');
    e.className='wd '+cls+(s==='full'?'full':s==='part'?'part':(i<t&&i>=0?'miss':''));
    e.innerHTML=dt.toLocaleDateString(undefined,{weekday:'narrow'})+'<i>'+(s==='full'?'✓':dt.getDate())+'</i>';
    wk.appendChild(e);
  }

  // journey
  const dn=Math.min(Math.max(t+1,0),66);
  $('ringC').setAttribute('stroke-dashoffset',264-264*dn/66);$('ringT').textContent=Math.round(dn/66*100)+'%';
  $('jTitle').textContent='Day '+dn+' of 66';
  $('jSub').textContent=(66-dn)+' days left · best streak '+best();
  const P=[['🌱','Build it','Days 1–22'],['⛰️','Push through','Days 23–44'],['🏆','Lock it in','Days 45–66']];
  $('phases').innerHTML=P.map((p,i)=>'<div class="phase" style="opacity:'+(Math.floor(Math.min(dn-1,65)/22)===i?1:.5)+'"><span class="dot">'+p[0]+'</span><div><b>'+p[1]+'</b><div class="mut">'+p[2]+'</div></div></div>').join('');
  const g=$('grid');g.innerHTML='';
  for(let i=0;i<66;i++){
    const b=document.createElement('button');b.textContent=(i===21||i===43||i===65)?'★':i+1;
    const s=st(i);let c='cell'+((i===21||i===43||i===65)?' ms':'');
    if(i>t)c+=' future';else if(s==='full')c+=' full';else if(s==='part')c+=' part';else if(i<t)c+=' miss';
    if(i===t)c+=' today';if(i===sel)c+=' sel';
    b.className=c;b.setAttribute('aria-label','Day '+(i+1));
    b.onclick=()=>{if(i<=t){sel=i;tab='today';render()}};
    g.appendChild(b);
  }

  // badges
  const perf=(()=>{let n=0;for(let i=0;i<=Math.min(t,65);i++)if(st(i)==='full')n++;return n})();
  const B=[['🎯','First day',perf>=1],['🔥','7-day streak',best()>=7],['⚡','21-day streak',best()>=21],['⛰️','Day 22 reached',t>=21],['💎','Day 44 reached',t>=43],['👑','66 complete',t>=65&&perf>0],['🏅','10 perfect days',perf>=10],['🚀','Level 3',L.n>=3],['🧠','30 perfect days',perf>=30]];
  $('badges').innerHTML=B.map(b=>'<div class="badge'+(b[2]?' on':'')+'"><span>'+b[0]+'</span>'+b[1]+'</div>').join('');

  view('v-'+tab);
}
$('edit').onclick=openSetup;
$('reset').onclick=()=>{if(confirm('Delete all progress and start over?')){S=null;try{localStorage.removeItem(KEY);localStorage.removeItem('reset66.v1')}catch(e){}openSetup()}};
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='66-day-reset-backup.json';a.click()};
render();
</script>
</body>
</html>
